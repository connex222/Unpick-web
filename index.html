<style>
:root{
  --ink:#101C24; --ink2:#16242E; --ink3:#1D3038; --line:#2A3E47;
  --bone:#EFE7D8; --bone-dim:#A8B4B8; --bone-faint:#6D7E85;
  --verdigris:#4EA89B; --brass:#D9A94B; --mauve:#A98BD1; --rust:#C4553D;
  --serif:'Fraunces',ui-serif,'Iowan Old Style','Palatino Linotype',Palatino,Charter,Georgia,'Noto Serif',serif;
  --sans:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --pad:clamp(18px,5vw,34px);
  --tile:clamp(34px,10.2vw,50px);
  --r:3px;
}
html[data-theme="paper"]{
  --ink:#E8E2D4; --ink2:#DED7C6; --ink3:#D3CBB7; --line:#BFB6A0;
  --bone:#1A2228; --bone-dim:#4E5A5F; --bone-faint:#7C878B;
  --verdigris:#1F6E62; --brass:#8A6415; --mauve:#5E3E92; --rust:#9E3A24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
/* iOS: 100vh includes the browser chrome, so it overflows; dvh tracks the real
   visible area. The vh line stays first as a fallback for older browsers. */
html{height:100vh;height:100dvh;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent}
button,.tile,.cell,.tab{touch-action:manipulation}
body{
  background:var(--ink); color:var(--bone); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
/* faint ambient wash — the only decorative flourish */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(78,168,155,.10), transparent 60%),
    radial-gradient(90% 60% at 100% 110%, rgba(217,169,75,.07), transparent 60%);
}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
  max-width:640px;margin:0 auto;
  padding-left:max(var(--pad), env(safe-area-inset-left));
  padding-right:max(var(--pad), env(safe-area-inset-right))}
.rail{padding-top:max(20px, calc(env(safe-area-inset-top) + 8px))}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:3px;border-radius:2px}

/* ── rail ───────────────────────────────────────────── */
.rail{display:flex;align-items:baseline;gap:10px;padding:22px 0 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
/* On very narrow phones the wordmark takes its own line rather than squeezing. */
@media (max-width:360px){ .brand{flex-basis:100%;margin:0 0 6px} }
.brand{font-family:var(--serif);font-variation-settings:'opsz' 120,'WONK' 1,'SOFT' 26;
  font-weight:600;font-size:clamp(27px,8vw,36px);letter-spacing:-.03em;margin-right:auto;line-height:.95}
.brand b{color:var(--verdigris);font-weight:600}
.streak{font-family:var(--mono);font-size:10px;color:var(--bone-faint);letter-spacing:.04em;white-space:nowrap}
.streak s{color:var(--brass);text-decoration:none;font-weight:700}
.themeBtn{font-size:15px;line-height:1;padding:4px;opacity:.55}
.themeBtn:hover{opacity:1}

/* ── tabs ───────────────────────────────────────────── */
.tabs{display:flex;gap:1px;margin:12px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--bone-faint);padding:9px 8px;border-radius:var(--r);white-space:nowrap;transition:.18s}
.tab:hover{color:var(--bone-dim);background:var(--ink2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--bone)}
html[data-theme="paper"] .tab[aria-selected="true"]{color:var(--ink);background:var(--bone)}

main{flex:1;padding:6px 0 28px}
.panel{display:none;animation:rise .3s ease both}
.panel.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── clue ───────────────────────────────────────────── */
.meta{font-family:var(--mono);font-size:10px;line-height:2.2;letter-spacing:.13em;
  text-transform:uppercase;color:var(--bone-faint);margin:26px 0 14px;overflow:hidden}
.meta > *{vertical-align:middle}
.meta .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--line);margin:0 7px}
.badge{display:inline-block;border:1px solid var(--line);padding:2px 7px;border-radius:2px;
  color:var(--bone-dim);line-height:1.5}
.badge.bdev{border-color:var(--brass);color:var(--brass)}

.clue{font-family:var(--serif);font-variation-settings:'opsz' 120,'SOFT' 24,'WONK' 1;
  font-weight:400;font-size:clamp(25px,7.1vw,35px);line-height:1.34;letter-spacing:-.012em;
  margin:0 0 6px;text-wrap:pretty}
.clue .enum{font-family:var(--mono);font-size:.52em;font-weight:500;color:var(--bone-faint);
  letter-spacing:.02em;vertical-align:.22em;margin-left:.15em}
.clue mark{background:none;color:inherit;transition:.45s}
.clue mark.def{box-shadow:inset 0 -2px 0 0 var(--verdigris);color:var(--bone)}
.clue mark.fod{color:var(--brass);box-shadow:inset 0 -2px 0 0 rgba(217,169,75,.55)}

/* ── tiles ──────────────────────────────────────────── */
.answer{margin:26px 0 4px}
.tileRow{display:flex;flex-wrap:wrap;gap:5px}
.gap{width:calc(var(--tile) * .42)}
.tile{width:var(--tile);height:calc(var(--tile) * 1.16);border:1px solid var(--line);
  border-radius:var(--r);background:var(--ink2);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:calc(var(--tile) * .46);color:var(--bone);
  cursor:text;transition:border-color .16s,background .16s;position:relative;user-select:none}
.tile.cur{border-color:var(--verdigris);background:var(--ink3);box-shadow:inset 0 0 0 1px var(--verdigris)}
.tile.given{color:var(--brass);border-color:rgba(217,169,75,.4)}
.tile.good{border-color:var(--verdigris);color:var(--verdigris);background:rgba(78,168,155,.09)}
.tile.reel{color:var(--brass)}
.tile.pop{animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.5) rotateX(-70deg);opacity:0}100%{transform:none;opacity:1}}
.tile.bad{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ── unpick (signature) ─────────────────────────────── */
.unpick{margin:20px 0 0;border-left:2px solid var(--brass);padding:2px 0 2px 15px;
  display:none;animation:rise .4s ease both}
.unpick.on{display:block}
.unpick .row{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:baseline;padding:3px 0}
.unpick .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--bone-faint);padding-top:2px}
.unpick .v{font-family:var(--mono);font-size:clamp(12px,3.3vw,13.5px);line-height:1.6;
  color:var(--bone-dim);word-break:break-word}
.unpick .v b{color:var(--brass);font-weight:700}
.unpick .v i{color:var(--verdigris);font-style:normal;font-weight:700}
.unpick .v .arw{color:var(--bone-faint);margin:0 .45em}
.unpick .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone-faint);display:block;margin-bottom:5px}
.unpick .note{font-size:13.5px;line-height:1.55;color:var(--bone-dim);margin-top:8px;font-style:italic}

.verdict{font-size:14px;margin:16px 0 0;line-height:1.5}
.verdict.win{color:var(--verdigris);font-weight:600}
.verdict.miss{color:var(--rust)}

/* ── hint drawer ────────────────────────────────────── */
.hints{margin:18px 0 0;display:flex;flex-direction:column;gap:9px}
.hint{background:var(--ink2);border:1px solid var(--line);border-left:2px solid var(--mauve);
  border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.55;color:var(--bone-dim);
  animation:rise .3s ease both}
.hint b{color:var(--bone);font-weight:600}
.hint .tier{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mauve);display:block;margin-bottom:5px}
.hint code{font-family:var(--mono);color:var(--brass);font-size:13px}

/* ── actions ────────────────────────────────────────── */
.acts{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.btn{font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:10px 15px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--ink2);color:var(--bone-dim);transition:.16s}
.btn:hover:not(:disabled){color:var(--bone);border-color:var(--bone-faint);background:var(--ink3)}
.btn:disabled{opacity:.34;cursor:default}
.btn.key:not(:disabled){background:var(--bone);color:var(--ink);border-color:var(--bone)}
.btn.key:hover{opacity:.88;color:var(--ink)}
.btn small{font-family:var(--mono);font-size:10px;opacity:.6;margin-left:5px}
.scoreTag{float:right;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brass);
  letter-spacing:.06em;border:1px solid rgba(217,169,75,.35);border-radius:2px;padding:2px 7px;line-height:1.5}

/* ── keyboard ───────────────────────────────────────── */
.kb{margin:20px 0 0;display:flex;flex-direction:column;gap:5px}
.kbrow{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:44px;height:42px;border-radius:var(--r);background:var(--ink2);
  border:1px solid var(--line);font-family:var(--mono);font-size:13px;font-weight:500;
  color:var(--bone-dim);transition:.1s}
.kb button:active{background:var(--verdigris);color:var(--ink);border-color:var(--verdigris)}
.kb button.wide{max-width:70px;font-size:11px}
.hiddenIn{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* ── mini crossword ─────────────────────────────────── */
.grid{display:grid;gap:3px;margin:22px 0;justify-content:start}
.cell{width:var(--tile);height:var(--tile);border:1px solid var(--line);border-radius:2px;
  background:var(--ink2);display:flex;align-items:center;justify-content:center;position:relative;
  font-family:var(--mono);font-weight:700;font-size:calc(var(--tile) * .44);cursor:pointer;user-select:none}
.cell.void{border:none;background:none;cursor:default}
.cell.cur{border-color:var(--verdigris);box-shadow:inset 0 0 0 1px var(--verdigris);background:var(--ink3)}
.cell.inword{background:var(--ink3)}
.cell.good{color:var(--verdigris);border-color:rgba(78,168,155,.45)}
.cell .n{position:absolute;top:1px;left:3px;font-size:9px;font-weight:500;color:var(--bone-faint)}
.cell.cross::after{content:"";position:absolute;top:0;right:0;width:0;height:0;
  border-top:7px solid var(--brass);border-left:7px solid transparent;opacity:.85}
.mclue{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mclue:last-of-type{border-bottom:1px solid var(--line)}
.mclue .tag{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--bone-faint);
  text-transform:uppercase;display:block;margin-bottom:4px}
.mclue.sel .tag{color:var(--verdigris)}
.mclue p{font-family:var(--serif);font-variation-settings:'SOFT' 24,'WONK' 1;
  font-size:clamp(17px,4.5vw,20px);line-height:1.4;margin:0}
.mclue.done p{color:var(--bone-faint)}
.mclue.done .tag::after{content:" ✓";color:var(--verdigris)}

/* ── stats ──────────────────────────────────────────── */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:2px;margin:24px 0}
.fig{background:var(--ink2);padding:15px 13px;border-radius:var(--r)}
.fig b{display:block;font-family:var(--serif);font-variation-settings:'WONK' 1;
  font-size:29px;font-weight:600;line-height:1;color:var(--bone);letter-spacing:-.02em}
.fig span{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--bone-faint);display:block;margin-top:7px}
.bars{margin:26px 0 0}
.bar{display:grid;grid-template-columns:88px 1fr 34px;gap:11px;align-items:center;
  font-size:12.5px;padding:6px 0;color:var(--bone-dim)}
.bar .t{height:5px;background:var(--ink3);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--verdigris);border-radius:3px;transition:width .6s}
.bar em{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--bone-faint);text-align:right}

/* ── guide ──────────────────────────────────────────── */
.g h2{font-family:var(--serif);font-variation-settings:'WONK' 1,'SOFT' 30;font-weight:600;
  font-size:clamp(22px,6vw,28px);letter-spacing:-.02em;margin:26px 0 8px}
.g > p{font-size:15px;line-height:1.65;color:var(--bone-dim);margin:0 0 22px}
.dev{border-top:1px solid var(--line);padding:16px 0}
.dev h3{font-family:var(--sans);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:700;color:var(--brass);margin:0 0 8px}
.dev p{font-size:14px;line-height:1.6;color:var(--bone-dim);margin:0 0 8px}
.dev .ex{font-family:var(--serif);font-variation-settings:'SOFT' 24,'WONK' 1;font-size:17px;
  line-height:1.4;color:var(--bone);margin:0}
.dev .ex span{font-family:var(--mono);font-size:12px;color:var(--verdigris);display:block;margin-top:5px}
.dev .tell{font-size:13px;color:var(--bone-faint);margin:8px 0 0}

footer{padding:26px 0 calc(34px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--bone-faint);line-height:1.8}
.flagRow{margin-top:14px}
.flagBtn{background:none;border:0;padding:6px 0;cursor:pointer;font-family:var(--sans);
  font-size:11.5px;color:var(--bone-faint);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line);transition:.18s}
.flagBtn:hover{color:var(--rust);text-decoration-color:var(--rust)}
.poolNote{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--bone-faint);margin:-12px 0 20px}
.verdict:empty{display:none}
/* -- large screens ----------------------------------- */
/* On a tablet the 640px column left the lower half of the screen empty and the
   type looked undersized. Everything scales from --tile and the clue clamp, so
   one query lifts the tiles, the mini grid and the clue together. */
@media (min-width:700px){
  :root{ --tile:60px; --pad:34px }
  .app{max-width:760px}
  .clue{font-size:clamp(32px,4.6vw,44px);line-height:1.3}
  .rail{padding:30px 0 18px}
  .tabs{gap:4px}
  .tab{padding:11px 14px;font-size:12px}
  .meta{font-size:11px;line-height:2.4}
  .dateTag{font-size:18px}
  .panel{padding-top:10px}
  .note{font-size:13.5px}
  .hint{font-size:15px}
  .grid{gap:4px;margin:30px 0}
  .kb{max-width:620px}
  /* panels already grow to fill the column, so centring their content vertically
     removes the dead band under the clue on a tall tablet screen */
  main{display:flex;flex-direction:column}
  .panel.on{flex:1;display:flex;flex-direction:column;justify-content:center}
  .panel.g.on{justify-content:flex-start}   /* the guide is long; keep it top-aligned */
  footer{padding:32px 0 40px;font-size:11.5px}
}
/* -- difficulty, date, guide masthead ---------------- */
.badge.tier{border-color:var(--line);color:var(--bone-faint)}
.badge.tier.t1{border-color:rgba(78,168,155,.5);color:var(--verdigris)}
.badge.tier.t2{border-color:rgba(217,169,75,.5);color:var(--brass)}
.badge.tier.t3{border-color:rgba(196,85,61,.6);color:var(--rust)}
.tierRow{display:flex;gap:6px;margin:0 0 20px}
.tierBtn{flex:1;background:none;border:1px solid var(--line);border-radius:var(--r);
  color:var(--bone-faint);font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 4px;cursor:pointer;transition:.18s}
.tierBtn small{display:block;font-size:11px;letter-spacing:0;opacity:.55;margin-top:3px}
.tierBtn:hover{color:var(--bone-dim);border-color:var(--bone-faint)}
.tierBtn.on.t1{border-color:var(--verdigris);color:var(--verdigris)}
.tierBtn.on.t2{border-color:var(--brass);color:var(--brass)}
.tierBtn.on.t3{border-color:var(--rust);color:var(--rust)}
.dateTag{font-family:var(--serif);font-variation-settings:'SOFT' 24,'WONK' 1;
  font-size:15px;font-style:italic;letter-spacing:0;text-transform:none;color:var(--bone)}
.gHead{margin:6px 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative}
.gHead::after{content:'';position:absolute;left:0;bottom:-1px;width:74px;height:3px;background:var(--brass)}
.gEyebrow{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--brass);margin-bottom:12px}
.panel.g .gHead h2{font-size:clamp(29px,8vw,40px);line-height:1.06;margin:0;
  letter-spacing:-.025em;font-variation-settings:'opsz' 120,'SOFT' 20,'WONK' 1}
/* -- welcome ---------------------------------------- */
.welcome{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;
  align-items:center;justify-content:center;overflow-y:auto;
  padding:max(30px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right))
          max(30px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left))}
.welcome[hidden]{display:none}
.wCard{width:100%;max-width:440px}
.wMark{font-family:var(--serif);font-variation-settings:'opsz' 120,'SOFT' 24,'WONK' 1;
  font-weight:600;font-size:clamp(42px,13.5vw,60px);letter-spacing:-.035em;line-height:1;color:var(--bone)}
.wMark b{color:var(--verdigris);font-weight:600}
.wLede{font-family:var(--serif);font-size:clamp(17px,4.7vw,20px);line-height:1.45;
  color:var(--bone-dim);margin:16px 0 0;text-wrap:pretty}
.wRule{height:1px;background:var(--line);margin:24px 0}
.wLab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-faint);margin:0 0 10px}
.wInput{width:100%;box-sizing:border-box;background:var(--ink2);border:1px solid var(--line);
  border-radius:var(--r);color:var(--bone);font-family:var(--serif);font-size:22px;
  padding:13px 14px;outline:none;transition:border-color .18s}
.wInput:focus{border-color:var(--verdigris)}
.wInput::placeholder{color:var(--bone-faint);font-style:italic}
.wRow{display:flex;gap:10px;margin-top:16px;align-items:center}
.wSkip{background:none;border:0;color:var(--bone-faint);font-family:var(--sans);font-size:12.5px;
  cursor:pointer;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.wSkip:hover{color:var(--bone-dim)}
.wFoot{font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--bone-faint);
  margin:28px 0 0;line-height:1.9}
.greet{font-family:var(--serif);font-variation-settings:'SOFT' 24,'WONK' 1;font-size:16.5px;
  font-style:italic;color:var(--bone-faint);margin:22px 0 -8px}
/* -- share ------------------------------------------ */
.shareRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.wa{border-color:rgba(78,168,155,.5);color:var(--verdigris)}
.btn.wa:hover{background:rgba(78,168,155,.09)}
.nameEdit{display:flex;gap:8px}
.nameEdit input{flex:1;min-width:0;background:var(--ink2);border:1px solid var(--line);
  border-radius:var(--r);color:var(--bone);font-family:var(--serif);font-size:16px;
  padding:9px 11px;outline:none}
.nameEdit input:focus{border-color:var(--verdigris)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:70;
  background:var(--ink3);border:1px solid var(--line);color:var(--bone);border-radius:var(--r);
  padding:11px 17px;font-family:var(--sans);font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;max-width:86vw;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.34)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* ─── storage: artifact store → localStorage → memory ─────────── */
const Store = (()=>{
  let mem={};
  const K='unpick.v1';
  async function load(){
    try{ if(window.storage){ const r=await window.storage.get(K); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s=window.localStorage&&localStorage.getItem(K); if(s) return JSON.parse(s); }catch(e){}
    return mem.d||null;
  }
  async function save(d){
    mem.d=d;
    try{ if(window.storage){ await window.storage.set(K,JSON.stringify(d)); return; } }catch(e){}
    try{ if(window.localStorage) localStorage.setItem(K,JSON.stringify(d)); }catch(e){}
  }
  return {load,save};
})();

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
/* A fixed permutation of the whole corpus, walked one clue per day. Deterministic,
   so every copy of the app shows the same daily clue, and no clue recurs until the
   full cycle is done. */
let _cycle = null;
function dailyCycle(){
  if(_cycle) return _cycle;
  const n = CLUES.length, idx = Array.from({length:n},(_,i)=>i);
  let s = 0x9E3779B9 ^ n;                       // seed fixed to the corpus size
  const rnd = () => { s = (s ^ s<<13)>>>0; s = (s ^ s>>>17)>>>0; s = (s ^ s<<5)>>>0; return s/4294967296; };
  for(let i=n-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
  _cycle = idx; return idx;
}
function dailyIndex(d){
  const c = dailyCycle();
  return c[((dayNo(d)-1) % c.length + c.length) % c.length];
}
function dayNo(d){ return Math.floor((new Date(d+'T00:00:00') - new Date('2026-01-01T00:00:00'))/864e5) + 1; }
/* Practice can be limited to a difficulty band. Stored so it survives a restart. */
function wantTiers(){ return S.tiers && S.tiers.length ? S.tiers : [1,2,3]; }
/* Seen clues are held as one character per clue, so it stays small however
   many clues there are, and tolerates the corpus growing later. */
function seenStr(){
  let s = typeof S.seen === 'string' ? S.seen : '';
  if(s.length < CLUES.length) s += '0'.repeat(CLUES.length - s.length);
  else if(s.length > CLUES.length) s = s.slice(0, CLUES.length);
  S.seen = s; return s;
}
function markSeen(i){
  const s = seenStr();
  if(i<0 || i>=s.length || s[i]==='1') return;
  S.seen = s.slice(0,i) + '1' + s.slice(i+1);
}
function unseenIn(want){
  const s = seenStr(), out = [];
  for(let i=0;i<CLUES.length;i++) if(s[i]==='0' && !EDITORIAL_REVIEW.has(i) && want.includes(CLUES[i][6]||2)) out.push(i);
  return out;
}
function practicePool(){
  const want = wantTiers();
  const fresh = unseenIn(want);
  if(fresh.length) return fresh;                    // never repeat while any are left
  const all = [];
  for(let i=0;i<CLUES.length;i++) if(!EDITORIAL_REVIEW.has(i) && want.includes(CLUES[i][6]||2)) all.push(i);
  return all.length ? all : CLUES.map((_,i)=>i).filter(i=>!EDITORIAL_REVIEW.has(i));
}
function filterHTML(){
  const want = S.tiers && S.tiers.length ? S.tiers : [1,2,3];
  const counts = [0,0,0,0];
  for(const c of CLUES) counts[c[6]||2]++;
  const btn = (t,label) => `<button class="tierBtn t${t} ${want.includes(t)?'on':''}" data-tier="${t}"
      aria-pressed="${want.includes(t)}">${label}<small>${counts[t]}</small></button>`;
  const left = unseenIn(want).length;
  const note = left
    ? `${left} you haven't seen yet`
    : `you've seen every clue in this selection — now reshuffling`;
  return `<div class="tierRow">${btn(1,'Easy')}${btn(2,'Medium')}${btn(3,'Hard')}</div>
    <p class="poolNote">${note}</p>`;
}

function copyTxt(txt){

    ta.select(); document.execCommand('copy'); ta.remove();

  }catch(e){ toast('Could not copy automatically'); }
}

function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const reduced = ()=> window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* split "Clue text (6)" → [body, enum] */
function splitClue(t){
  const m = t.match(/^(.*?)\s*\(([\d,\- ]+)\)\s*$/);
  return m ? [m[1], m[2]] : [t, ''];
}

/* mark a substring (case-insensitive) inside escaped text */
function markUp(body, def, fod, showDef, showFod){
  let out = esc(body);
  const used = [];
  const wrap = (needle, cls) => {
    if(!needle) return;
    const n = esc(needle).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const m = new RegExp(n,'i').exec(out);
    if(!m) return;
    const a=m.index, b=m.index+m[0].length;
    if(used.some(([s,e]) => a < e && s < b)) return;   // never nest marks
    used.push([a,b]);
    out = out.slice(0,a) + '\u0001'+cls+'\u0002' + m[0] + '\u0003' + out.slice(b);
  };
  if(showDef) wrap(def,'def');
  if(showFod) wrap(fod,'fod');
  return out.replace(/\u0001(\w+)\u0002/g,'<mark class="$1">').replace(/\u0003/g,'</mark>');
}

/* ─── the solver engine ───────────────────────────────────────── */
class Solver{
  constructor(host, mode){
    this.host=host; this.mode=mode; this.idx=0; this.cur=0;
    this.hints=0; this.given=[]; this.state='play'; this.strokes=0; this.wrong=0;
  }
  persist(){
    S.sessions=S.sessions||{};
    S.sessions[this.mode]={i:this.i,day:this.mode==='daily'?today():null,fill:this.fill.join(''),
      cur:this.cur,hints:this.hints,given:this.given.slice(),state:this.state,
      strokes:this.strokes,wrong:this.wrong};
    Store.save(S);
  }
  restore(){
    const q=(S.sessions||{})[this.mode];
    if(!q||q.i!==this.i||(this.mode==='daily'&&q.day!==today())||
       !['play','won','shown'].includes(q.state)||
       typeof q.fill!=='string'||!/^[A-Z]*$/.test(q.fill)||q.fill.length>this.ans.length) return;
    this.fill=Array.from({length:this.ans.length},(_,i)=>q.fill[i]||'');
    this.cur=Math.max(0,Math.min(this.ans.length,q.cur|0));
    this.hints=Math.max(0,Math.min(3,q.hints|0));
    this.given=Array.isArray(q.given)?q.given.filter(i=>Number.isInteger(i)&&i>=0&&i<this.ans.length):[];
    this.state=q.state;this.strokes=Math.max(0,q.strokes|0);this.wrong=Math.max(0,q.wrong|0);
    if(this.state!=='play'){this.fill=[...this.ans];
      this.msg=this.state==='won'?'Previously solved — explanation below.':'You chose to reveal the answer.';
      this.msgCls=this.state==='won'?'win':'miss';}
  }
  pick(i, fresh=false){
    this.i=i; this.c=CLUES[i];
    const [body,en]=splitClue(this.c[0]);
    this.body=body; this.en=en; this.ans=letters(this.c[1]);
    this.fill=Array(this.ans.length).fill('');
    this.cur=0; this.hints=0; this.given=[]; this.state='play'; this.strokes=0; this.wrong=0;
    this.msg=''; this.msgCls='';
    if(!fresh) this.restore();
    this.render(); this.persist();
  }
  next(){
    if(this.mode==='daily'){ this.pick(this.i,true); return; }
    if(this.mode==='learn'){ this.nextLesson(); return; }
    const pool = practicePool();
    let i, guard=0;
    do{ i=pool[Math.floor(Math.random()*pool.length)]; guard++; }while(i===this.i && guard<9);
    this.pick(i);
  }
  nextLesson(){
    S.lessonStep=(lessonIndex(this.i)+1)%LEARN_STEPS.length;
    Store.save(S);this.pick(LEARN_STEPS[S.lessonStep].i);
  }
  /* positions of letter cells within the raw answer string */
  cells(){
    const out=[]; const raw=this.c[1];
    for(let k=0;k<raw.length;k++) out.push(/[A-Za-z]/.test(raw[k])?'L':'G');
    return out;
  }
  type(ch){
    if(this.state!=='play') return;
    const n=this.ans.length;
    if(this.cur>=n) return;
    this.fill[this.cur]=ch;
    let j=this.cur+1; while(j<n && this.given.includes(j)) j++;
    this.cur=Math.min(j,n);
    this.paint(); this.persist(); this.auto();
  }
  back(){
    if(this.state!=='play') return;
    let j=this.cur-1; while(j>=0 && this.given.includes(j)) j--;
    if(j<0) return;
    this.fill[j]=''; this.cur=j; this.paint(); this.persist();
  }
  auto(){ if(this.fill.join('').length===this.ans.length && this.fill.join('')===this.ans) this.win(); }

  addHint(){
    if(this.state!=='play'||this.hints>=3) return;
    this.hints++; this.strokes++; this.render(); this.persist();
  }
  giveLetter(){
    if(this.state!=='play') return;
    const free=[...this.ans].map((_,k)=>k).filter(k=>!this.given.includes(k)&&this.fill[k]!==this.ans[k]);
    if(!free.length) return;
    const k=free[0];
    this.given.push(k); this.fill[k]=this.ans[k]; this.strokes+=2;
    if(this.cur===k){ let j=k+1; while(j<this.ans.length&&this.given.includes(j))j++; this.cur=j; }
    this.render(); this.persist(); this.auto();
  }
  check(){
    if(this.state!=='play') return;
    if(this.fill.join('')===this.ans) return this.win();
    if(this.fill.some(ch=>!ch)){
      this.msg='There are empty spaces. The enumeration tells you how many letters you need.';
      this.msgCls='miss';this.render();return;
    }
    this.wrong++;
    this.msg=this.hints===0?'Not quite. Find the definition at one end, then look at the wordplay.':
      this.hints===1?'Not yet. Compare your answer with the likely definition.':
      'Not yet. Check the indicator and follow each wordplay step, then check the definition.';
    this.msgCls='miss';this.render();this.persist();
    this.host.querySelectorAll('.tile').forEach(t=>{t.classList.add('bad');setTimeout(()=>t.classList.remove('bad'),340)});
  }
  win(){
    if(this.state!=='play') return;
    this.state='won';
    this.fill=[...this.ans];
    const independent=this.hints===0&&this.given.length===0&&this.wrong===0;
    recordSolve(this.c[2],this.strokes,independent,this.mode,this.i,this.wrong);
    if(this.mode==='learn'){
      S.learnProgress=S.learnProgress||{};
      const prior=S.learnProgress[this.i]||{};
      S.learnProgress[this.i]={solved:true,independent:!!prior.independent||independent,
        lastHelp:this.hints,wrong:this.wrong};
    }
    this.msg = this.strokes===0 ? 'Solved clean. No hints, no reveals.'
             : 'Solved — '+this.strokes+' over par.';
    this.msgCls='win';
    this.render(); this.persist(); this.reel();
  }
  giveUp(){
    if(this.state!=='play') return;
    if(!confirm('Reveal the full answer and parsing? You can keep trying instead.')) return;
    this.state='shown'; this.fill=[...this.ans];
    markSeen(this.i);   // shown counts as seen, or Practice keeps serving it back
    Store.save(S);
    this.msg='Answer shown — the unpick is below.'; this.msgCls='miss';
    this.render(); this.persist(); this.reel();
  }
  /* signature: letters spin into place, fastest for anagrams */
  reel(){
    if(reduced()) return;
    const tiles=[...this.host.querySelectorAll('.tile')];
    const pool = this.c[2]==='ana' ? letters(this.c[4]).split('') : this.ans.split('');
    tiles.forEach((t,k)=>{
      const final=t.dataset.ch; if(!final) return;
      t.classList.add('reel');
      let n=0, spins=4+k*2;
      const iv=setInterval(()=>{
        t.textContent = pool[Math.floor(Math.random()*pool.length)];
        if(++n>=spins){ clearInterval(iv); t.textContent=final;
          t.classList.remove('reel'); t.classList.add('pop','good'); }
      }, 42);
    });
  }

  hintText(t){
    const c=this.c, d=DEV[c[2]];
    if(EDITORIAL_REVIEW.has(this.i))return {tier:'Editorial review',
      html:'This clue has a disputed definition or construction. Its parsing is withheld pending review.'};
    if(t===1)return {tier:'Hint 1 — clue type',
      html:'Look for a <b>'+esc(d.n.toLowerCase())+'</b>. '+esc(d.hint)};
    if(t===2){
      if(c[2]==='dd')return {tier:'Hint 2 — both meanings',
        html:'Both parts separately define the same word. There is no separate wordplay.'};
      if(c[2]==='lit')return {tier:'Hint 2 — the whole clue',
        html:'The whole clue supplies both the definition and the wordplay.'};
      return {tier:'Hint 2 — likely definition',
        html:'The underlined words near the clue edge are <b>'+esc(c[3])+'</b>. What fits that meaning and length?'};
    }
    const step=LEARN_STEPS.find(x=>x.i===this.i);
    if(step)return {tier:'Hint 3 — the signal',
      html:'Look at <b>'+esc(step.indicator)+'</b>. '+esc(c[2]==='cha'?
        'Join smaller pieces in clue order.':c[2]==='hid'?
        'Ignore word breaks and read the letters in sequence.':
        'Rearrange the given letters without adding or removing any.')};
    return {tier:'Hint 3 — the indicator and method',
      html:esc(d.tell)+' Find the indicator before manipulating the letters. No answer letters are given.'};
  }
  unpickHTML(){
    if(EDITORIAL_REVIEW.has(this.i)) return '<span class="lbl">Editorial review pending</span><p class="note">A reliable parsing has not been established.</p>';
    const c=this.c, d=DEV[c[2]];
    let op;
    const A=`<i>${esc(c[1])}</i>`;
    switch(c[2]){
      case 'ana': op=`<b>${esc(c[4])}</b> anagrammed <span class="arw">→</span> ${A}`; break;
      case 'hid': op=`hidden in “<b>${esc(c[4])}</b>” <span class="arw">→</span> ${A}`; break;
      case 'rev': op=`<b>${esc(c[4])}</b> reversed <span class="arw">→</span> ${A}`; break;
      case 'cha': op=`<b>${esc(c[4])}</b> <span class="arw">→</span> ${A}`; break;
      case 'con': op=`<b>${esc(c[4])}</b> <span class="arw">→</span> ${A}`; break;
      case 'del': op=`<b>${esc(c[4])}</b> <span class="arw">→</span> ${A}`; break;
      case 'hom': op=`sounds like <b>${esc(c[4])}</b> <span class="arw">→</span> ${A}`; break;
      case 'ini': op=`first letters of “<b>${esc(c[4])}</b>” <span class="arw">→</span> ${A}`; break;
      case 'alt': op=`alternate letters of “<b>${esc(c[4])}</b>” <span class="arw">→</span> ${A}`; break;
      default:    op=`<b>${esc(c[4])}</b> <span class="arw">→</span> ${A}`;
    }
    const defLine = c[3]
      ? `<div class="row"><span class="k">definition</span><span class="v"><i>${esc(c[3])}</i></span></div>`
      : `<div class="row"><span class="k">definition</span><span class="v">both halves of the clue</span></div>`;
    return `<span class="lbl">${d.n} · unpicked</span>
      ${defLine}
      <div class="row"><span class="k">wordplay</span><span class="v">${op}</span></div>
      ${c[5]?`<p class="note">${esc(c[5])}</p>`:''}`;
  }

  render(){
    const c=this.c, over=this.state!=='play';
    const showDef = over || this.hints>=2;
    const showFod = over;
    const cells=this.cells();
    let li=0, tiles='';
    for(const k of cells){
      if(k==='G'){ tiles+='<div class="gap"></div>'; continue; }
      const j=li++;
      const ch=this.fill[j]||'';
      const cls=['tile'];
      if(this.given.includes(j)) cls.push('given');
      if(!over && j===this.cur) cls.push('cur');
      if(over) cls.push('good');
      tiles+=`<div class="${cls.join(' ')}" data-j="${j}" data-ch="${ch}">${esc(ch)}</div>`;
    }
    let hints='';
    for(let t=1;t<=this.hints;t++){ const h=this.hintText(t);
      hints+=`<div class="hint"><span class="tier">${h.tier}</span>${h.html}</div>`; }

    const greet = (this.mode==='daily' && S.name)
      ? `<div class="greet">${esc(greeting())}, ${esc(S.name)}.</div>` : '';
    const label = this.mode==='daily'
      ? `<span class="badge">Daily</span><span class="dot"></span>No. ${dayNo(today())}<span class="dot"></span><span class="dateTag">${new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'long'})}</span>`
      : `<span class="badge">Practice</span><span class="dot"></span>Clue ${this.i+1} of ${CLUES.length}`;
    const scoreTag = `<span class="scoreTag">${this.strokes===0?'E':'+'+this.strokes}</span>`;
    const T = c[6]||2, tName = ['','Easy','Medium','Hard'][T];
    const tierTag = `<span class="dot"></span><span class="badge tier t${T}">${tName}</span>`;
    const devBadge = (over||this.hints>=1) ? `<span class="dot"></span><span class="badge bdev">${DEV[c[2]].n}</span>` : '';

    this.host.innerHTML = `
      ${greet}
      <div class="meta">${scoreTag}${label}${tierTag}${devBadge}</div>
      ${this.mode==='practice' ? filterHTML() : ''}
      <p class="clue">${markUp(this.body,c[3],c[4],showDef,showFod)}<span class="enum">(${esc(this.en)})</span></p>
      <div class="answer"><div class="tileRow" role="group"
        aria-label="Answer, ${this.fill.length} letters, ${this.fill.filter(Boolean).length} entered">${tiles}</div></div>
      <div class="verdict ${this.msgCls||''}" role="status" aria-live="polite">${this.msg?esc(this.msg):''}</div>
      <div class="unpick ${over?'on':''}">${over?this.unpickHTML():''}</div>
      <div class="hints">${hints}</div>
      <div class="acts">
        <button class="btn key" data-a="check" ${over?'disabled':''}>Check</button>
        <button class="btn" data-a="hint" ${over||this.hints>=3?'disabled':''}>Hint<small>+1</small></button>
        <button class="btn" data-a="letter" ${over?'disabled':''}>Letter<small>+2</small></button>
        ${over ? `<button class="btn" data-a="next">${this.mode==='daily'?'Again':'Next'}</button>`
               : `<button class="btn" data-a="up">Give up</button>`}
      </div>
      <div class="flagRow"><button class="flagBtn" data-a="flag"
        title="Send the clue's details so it can be looked at">&#9873; Something wrong with this clue?</button></div>
      ${over ? `<div class="shareRow">
        <button class="btn wa" data-a="wa">Share to WhatsApp</button>
        <button class="btn" data-a="share">Share&hellip;</button>
      </div>` : `<div class="kb">${kbHTML()}</div>`}`;
    this.wire();
  }
  paint(){
    const t=[...this.host.querySelectorAll('.tile')];
    t.forEach(el=>{ const j=+el.dataset.j; const ch=this.fill[j]||'';
      el.textContent=ch; el.dataset.ch=ch;
      el.classList.toggle('cur', this.state==='play' && j===this.cur); });
    // keep the screen-reader label in step with what has been typed
    const row=this.host.querySelector('.tileRow');
    if(row) row.setAttribute('aria-label',
      `Answer, ${this.fill.length} letters, ${this.fill.filter(Boolean).length} entered`);
  }
  reportText(){
    const c=this.c, dev=(DEV[c[2]]&&DEV[c[2]].n)||c[2];
    const tier=['','Easy','Medium','Hard'][c[6]||2];
    return ['Unpick \u2014 clue report (v'+APP_VERSION+')',
      (this.mode==='daily' ? 'Daily No. '+dayNo(today()) : 'Practice')+' \u00b7 clue #'+this.i,
      '',
      'Clue: '+c[0],
      'Answer: '+c[1],
      'Device: '+dev+' \u00b7 rated '+tier,
      '',
      'What is wrong with it: '].join('\n');
  }
  shareText(){
    const nm = S.name || 'Someone';
    const sc = this.strokes===0 ? 'E (par)' : '+'+this.strokes;
    const L = ['Unpick \u2014 ' + (this.mode==='daily'
      ? 'Daily Cryptic No. '+dayNo(today()) : 'Practice clue')];
    if(this.state==='shown'){
      L.push(nm+' had to look at this one.');
    } else if(this.hints===0 && this.given.length===0){
      L.push(nm+' solved it unaided. Scored '+sc+'.');
    } else {
      const bits=[];
      if(this.hints) bits.push(this.hints+' hint'+(this.hints>1?'s':''));
      if(this.given.length) bits.push(this.given.length+' letter'+(this.given.length>1?'s':''));
      L.push(nm+' solved it with '+bits.join(' and ')+'. Scored '+sc+'.');
    }
    if(this.mode==='daily' && S.streak>1) L.push('Streak: '+S.streak+' days.');
    L.push('');
    L.push('No spoilers here \u2014 see how you do.');
    return L.join('\n');
  }
  wireTiers(){
    this.host.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{
      const t = +b.dataset.tier;
      let want = (S.tiers && S.tiers.length ? S.tiers : [1,2,3]).slice();
      want = want.includes(t) ? want.filter(x=>x!==t) : want.concat(t).sort();
      if(!want.length) want = [1,2,3];          // never leave nothing selected
      S.tiers = want; Store.save(S);
      if(!want.includes(CLUES[this.i][6]||2)) this.next(); else this.render();
    });
  }
  wire(){
    this.wireTiers();
    this.host.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='hint') this.addHint();
      else if(a==='letter') this.giveLetter();
      else if(a==='check') this.check();
      else if(a==='up') this.giveUp();
      else if(a==='next') this.next();
      else if(a==='flag'){ sharePlain(this.reportText()); toast('Add what is wrong, then send it over.'); }
      else if(a==='wa') shareWA(this.shareText());
      else if(a==='share') sharePlain(this.shareText());
      focusIn();
    });
    this.host.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
      if(this.state!=='play') return;
      this.cur=+el.dataset.j; this.paint(); focusIn();
    });
    this.host.querySelectorAll('.kb button').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='<') this.back(); else if(k==='=') this.check(); else this.type(k);
    });
  }
}
function kbHTML(){
  const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  return rows.map((r,i)=>{
    let s=r.split('').map(k=>`<button data-k="${k}">${k}</button>`).join('');
    if(i===2) s=`<button class="wide" data-k="=">CHECK</button>`+s+`<button class="wide" data-k="<">DEL</button>`;
    return `<div class="kbrow">${s}</div>`;
  }).join('');
}

/* ─── stats ───────────────────────────────────────────────────── */
function recordSolve(dev, strokes, clean, mode, idx){
  if(typeof idx === 'number') markSeen(idx);
  S.solved++; S.strokes+=strokes;
  if(clean) S.unaided++;
  S.dev[dev]=(S.dev[dev]||0)+1;
  const t=today();
  if(mode==='daily' && !S.doneDaily[t]){
    S.doneDaily[t]=true;
    const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
    S.streak = (S.last===y || S.last===t) ? (S.last===t?S.streak:S.streak+1) : 1;
    S.last=t; S.best=Math.max(S.best,S.streak);
  }
  Store.save(S); paintRail(); renderStats();
}
function paintRail(){
  $('#streakRail').innerHTML = `<s>${S.streak}</s> day streak <span style="opacity:.4">·</span> <s>${S.solved}</s> solved`;
}
function renderStats(){
  const avg = S.solved? (S.strokes/S.solved) : 0;
  const pct = S.solved? Math.round(100*S.unaided/S.solved) : 0;
  const max = Math.max(1,...ORDER.map(d=>S.dev[d]||0));
  $('#p-stats').innerHTML = `
    <h2 style="font-family:var(--serif);font-variation-settings:'WONK' 1,'SOFT' 30;font-weight:600;
      font-size:clamp(22px,6vw,28px);letter-spacing:-.02em;margin:26px 0 6px">Progress</h2>
    <p style="font-size:15px;line-height:1.65;color:var(--bone-dim);margin:0 0 4px">
      Scoring runs like golf: par is nought. A hint costs one stroke, a revealed letter costs two.</p>
    <div class="figs">
      <div class="fig"><b>${S.streak}</b><span>Day streak</span></div>
      <div class="fig"><b>${S.best}</b><span>Best streak</span></div>
      <div class="fig"><b>${S.solved}</b><span>Solved</span></div>
      <div class="fig"><b>${S.solved?(avg<0.05?'E':'+'+avg.toFixed(1)):'—'}</b><span>Avg score</span></div>
      <div class="fig"><b>${pct}%</b><span>Unaided</span></div>
      <div class="fig"><b>${S.minis}</b><span>Minis done</span></div>
    </div>
    <div class="bars">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--bone-faint);margin-bottom:10px">Devices you have cracked</div>
      ${ORDER.map(d=>{const v=S.dev[d]||0;return `<div class="bar"><span>${DEV[d].n}</span>
        <div class="t"><i style="width:${Math.round(100*v/max)}%"></i></div><em>${v}</em></div>`}).join('')}
    </div>
    <div class="bars" style="margin-top:20px">
      <div style="font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--bone-faint);margin-bottom:10px">Your name</div>
      <div class="nameEdit">
        <input id="nameIn" maxlength="22" placeholder="Your name" spellcheck="false">
        <button class="btn" id="nameSave">Save</button>
      </div>
    </div>
    <div class="acts"><button class="btn" id="resetBtn">Reset all progress</button></div>`;
  const ni=$('#nameIn');
  if(ni){ ni.value = S.name||'';
    const sv=()=>{ S.name=ni.value.trim().replace(/\s+/g,' ').slice(0,22); Store.save(S);
      if(typeof daily!=='undefined' && daily) daily.render();
      toast(S.name ? 'Saved. Hello, '+S.name+'.' : 'Name cleared.'); };
    $('#nameSave').onclick=sv;
    ni.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); sv(); } };
  }
  const r=$('#resetBtn'); if(r) r.onclick=()=>{
    if(!confirm('Clear your streak, scores and device history?')) return;
    S={name:S.name,asked:true,solved:0,unaided:0,strokes:0,streak:0,best:0,last:null,dev:{},doneDaily:{},minis:0};
    Store.save(S); paintRail(); renderStats();
  };
}

/* ─── guide ───────────────────────────────────────────────────── */
function renderGuide(){
  $('#p-guide').innerHTML = `
    <div class="gHead">
      <span class="gEyebrow">The guide</span>
      <h2>Every cryptic clue has two halves</h2>
    </div>
    <p>One half is a plain <strong style="color:var(--verdigris)">definition</strong> of the answer, sitting at the
    start or the end of the clue. The other half is <strong style="color:var(--brass)">wordplay</strong> that spells
    the same answer a second way. The number in brackets tells you how long the answer is. The trick is that the
    surface reading — the sentence you first see — is deliberately misleading. Below are the ${ORDER.length} devices in this
    collection, with a real clue from it.</p>
    <p>Clues are rated <strong style="color:var(--verdigris)">Easy</strong>,
    <strong style="color:var(--brass)">Medium</strong> or
    <strong style="color:var(--rust)">Hard</strong> according to how much work they ask of you:
    which device is in play, whether the letters to juggle are printed in the clue or have to be
    worked out first, how familiar the answer is, and how many pieces there are. Practice lets
    you pick the bands you want.</p>
    ${ORDER.map(k=>{const d=DEV[k];const [b,e]=splitClue(d.ex);return `
      <div class="dev">
        <h3>${d.n}</h3>
        <p>${d.hint}</p>
        <p class="ex">${esc(b)} <span style="display:inline;font-family:var(--mono);font-size:12px;color:var(--bone-faint)">(${e})</span>
          <span>${d.exA} — ${esc(d.exW)}</span></p>
        <p class="tell">${d.tell}</p>
      </div>`}).join('')}
    <div class="dev"><h3>Where the words come from</h3>
      <p>Definitions were drawn from <em>WordNet</em>, Princeton University's lexical database,
      and pronunciations for the homophones from the <em>CMU Pronouncing Dictionary</em>.
      WordNet is Copyright &copy; 2010 The Trustees of Princeton University and is used under
      its permissive licence. Every clue was then checked mechanically, and the harder ones
      written by hand.</p></div>
    <div class="dev"><h3>A word on scoring</h3>
      <p>Par is nought: solve it cold and you score <em>E</em>. Each hint adds a stroke, each revealed letter adds two.
      Lower is better, and there is no penalty for taking your time.</p></div>`;
}

/* ─── mini crossword: one across, one down, crossing ──────────── */
const MINI_OK = CLUES.map((c,i)=>i).filter(i=>{
  const a=letters(CLUES[i][1]);
  return a.length>=4 && a.length<=8 && CLUES[i][1].indexOf(' ')<0;
});
function buildMini(seed){
  const rnd = mulberry(seed);
  // phase 0 demands a crossing interior to BOTH words, so the grid forms a true cross;
  // phase 1 relaxes to any shared letter, in case a seed is unlucky 400 times over.
  for(let phase=0;phase<2;phase++){
    for(let tries=0;tries<400;tries++){
      const A=MINI_OK[Math.floor(rnd()*MINI_OK.length)];
      const aw=letters(CLUES[A][1]);
      const B=MINI_OK[Math.floor(rnd()*MINI_OK.length)];
      if(B===A) continue;
      const bw=letters(CLUES[B][1]);
      if(bw===aw) continue;
      const pairs=[];
      for(let i=0;i<aw.length;i++) for(let j=0;j<bw.length;j++) if(aw[i]===bw[j]) pairs.push([i,j]);
      if(!pairs.length) continue;
      const inner=pairs.filter(([i,j])=>i>0&&i<aw.length-1&&j>0&&j<bw.length-1);
      const pool = phase===0 ? inner : (inner.length?inner:pairs);
      if(!pool.length) continue;
      const [ci,cj]=pool[Math.floor(rnd()*pool.length)];
      return {A,B,aw,bw,ci,cj};
    }
  }
  return null;
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const Mini = {
  seed: hash(today()+'m'), dir:'A', pos:0, done:{A:false,B:false}, revealed:false,
  start(newSeed){
    if(newSeed) this.seed = (this.seed*1664525+1013904223)>>>0;
    this.m = buildMini(this.seed);
    this.fa=Array(this.m.aw.length).fill(''); this.fb=Array(this.m.bw.length).fill('');
    this.dir='A'; this.pos=0; this.done={A:false,B:false}; this.revealed=false; this.msg='';
    this.render();
  },
  cellVal(r,c){
    const m=this.m;
    if(r===m.cj && c<m.aw.length) { // across row
      if(c===m.ci) return this.fa[c] || this.fb[m.cj];
      return this.fa[c];
    }
    if(c===m.ci && r<m.bw.length) return this.fb[r];
    return null;
  },
  set(ch){
    const m=this.m;
    if(this.dir==='A'){ this.fa[this.pos]=ch; if(this.pos===m.ci) this.fb[m.cj]=ch;
      this.pos=Math.min(this.pos+1,m.aw.length-1); }
    else { this.fb[this.pos]=ch; if(this.pos===m.cj) this.fa[m.ci]=ch;
      this.pos=Math.min(this.pos+1,m.bw.length-1); }
    this.check(true); this.render();
  },
  del(){
    const m=this.m;
    if(this.dir==='A'){ if(this.fa[this.pos]==='') this.pos=Math.max(0,this.pos-1);
      this.fa[this.pos]=''; if(this.pos===m.ci) this.fb[m.cj]=''; }
    else { if(this.fb[this.pos]==='') this.pos=Math.max(0,this.pos-1);
      this.fb[this.pos]=''; if(this.pos===m.cj) this.fa[m.ci]=''; }
    this.render();
  },
  check(quiet){
    const m=this.m;
    const a=this.fa.join('')===m.aw, b=this.fb.join('')===m.bw;
    const wasA=this.done.A, wasB=this.done.B;
    this.done={A:a,B:b};
    if(a&&!wasA) recordSolve(CLUES[m.A][2],0,true,'mini',m.A);
    if(b&&!wasB) recordSolve(CLUES[m.B][2],0,true,'mini',m.B);
    if(a&&b&&!(wasA&&wasB)){ S.minis++; Store.save(S); this.msg='Both cracked. That is the mini done.'; }
    else if(!quiet && !(a&&b)) this.msg='Not there yet — the crossing letter is your friend.';
    if(!quiet) this.render();
  },
  reveal(){ const m=this.m; this.fa=[...m.aw]; this.fb=[...m.bw];
    this.done={A:true,B:true}; this.revealed=true; this.msg='Answers shown, with both unpicks below.'; this.render(); },
  render(){
    const m=this.m; if(!m){ $('#p-mini').innerHTML='<p>Could not build a grid — try again.</p>'; return; }
    const rows=m.bw.length, cols=m.aw.length;
    let g='';
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const inA = r===m.cj, inB = c===m.ci;
      if(!inA && !inB){ g+='<div class="cell void"></div>'; continue; }
      const v=this.cellVal(r,c)||'';
      const isCur = (this.dir==='A' && inA && c===this.pos) || (this.dir==='B' && inB && r===this.pos);
      const inWord = (this.dir==='A'&&inA) || (this.dir==='B'&&inB);
      const solved = (inA&&this.done.A) || (inB&&this.done.B);
      const num = (inA&&c===0) ? '1' : (inB&&r===0 ? (m.cj===0&&m.ci===0?'':'2') : '');
      const cross = inA&&inB;
      g+=`<div class="cell${isCur?' cur':''}${inWord&&!isCur?' inword':''}${solved?' good':''}${cross?' cross':''}"
            data-r="${r}" data-c="${c}"${cross?' title="the shared letter"':''}>${num?`<span class="n">${num}</span>`:''}${v}</div>`;
    }
    const clueBlock=(key,ci,tag)=>{
      const c=CLUES[ci]; const [b,e]=splitClue(c[0]);
      const done=this.done[key];
      return `<div class="mclue ${this.dir===key?'sel':''} ${done?'done':''}" data-dir="${key}">
        <span class="tag">${tag} · ${letters(c[1]).length} letters</span>
        <p>${markUp(b,c[3],c[4],done,done)} <span style="font-family:var(--mono);font-size:.62em;color:var(--bone-faint)">(${e})</span></p>
        ${done?`<div class="unpick on" style="margin-top:12px">${solverFor(ci).unpickHTML()}</div>`:''}
      </div>`;
    };
    $('#p-mini').innerHTML=`
      <div class="meta"><span class="badge">Mini</span><span class="dot"></span>Two clues, one crossing letter
        <span class="dot"></span>${MINI_OK.length} clues in the pool</div>
      <div class="grid" style="grid-template-columns:repeat(${cols},var(--tile))">${g}</div>
      ${this.msg?`<div class="verdict ${this.done.A&&this.done.B?'win':''}">${esc(this.msg)}</div>`:''}
      ${clueBlock('A',m.A,'1 Across')}
      ${clueBlock('B',m.B,'2 Down')}
      <div class="acts">
        <button class="btn key" data-m="check">Check</button>
        <button class="btn" data-m="reveal" ${this.revealed?'disabled':''}>Show answers</button>
        <button class="btn" data-m="new">New mini</button>
      </div>
      ${(this.done.A&&this.done.B)||this.revealed ? `<div class="shareRow">
        <button class="btn wa" data-m="wa">Share to WhatsApp</button>
        <button class="btn" data-m="share">Share&hellip;</button>
      </div>` : `<div class="kb">${kbHTML()}</div>`}`;
    // wire
    $('#p-mini').querySelectorAll('.cell:not(.void)').forEach(el=>el.onclick=()=>{
      const r=+el.dataset.r, c=+el.dataset.c;
      const inA=r===m.cj, inB=c===m.ci;
      if(inA&&inB) this.dir = this.dir==='A'?'B':'A';
      else this.dir = inA?'A':'B';
      this.pos = this.dir==='A'?c:r; this.render(); focusIn();
    });
    $('#p-mini').querySelectorAll('.mclue').forEach(el=>el.onclick=()=>{
      this.dir=el.dataset.dir; this.pos=0; this.render(); focusIn(); });
    $('#p-mini').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.m;
      if(a==='check') this.check(false); else if(a==='reveal') this.reveal();
      else if(a==='wa') shareWA(miniShare()); else if(a==='share') sharePlain(miniShare());
      else this.start(true);
      focusIn();
    });
    $('#p-mini').querySelectorAll('.kb button').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='<') this.del(); else if(k==='=') this.check(false); else this.set(k);
    });
  }
};
function solverFor(i){ const s=new Solver(document.createElement('div'),'x'); s.c=CLUES[i]; s.ans=letters(CLUES[i][1]); return s; }

/* ─── shell ───────────────────────────────────────────────────── */
let daily, practice, activePanel='daily';
function focusIn(){ /* desktop typing goes through the document keydown listener; mobile uses the
     on-screen keyboard, so we deliberately never summon the native one over the clue */ }

document.addEventListener('keydown',e=>{
  if(welcomeOpen()) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const target = activePanel==='daily'?daily : activePanel==='practice'?practice : activePanel==='mini'?Mini : null;
  if(!target) return;
  if(/^[a-zA-Z]$/.test(e.key)){
    e.preventDefault();
    if(target===Mini) Mini.set(e.key.toUpperCase()); else target.type(e.key.toUpperCase());
  } else if(e.key==='Backspace'){
    e.preventDefault(); target===Mini?Mini.del():target.back();
  } else if(e.key==='Enter'){
    e.preventDefault(); target===Mini?Mini.check(false):target.check();
  } else if(target===Mini && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault(); Mini.dir='A'; Mini.pos=Math.max(0,Math.min(Mini.m.aw.length-1,Mini.pos+(e.key==='ArrowRight'?1:-1))); Mini.render();
  } else if(target===Mini && (e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault(); Mini.dir='B'; Mini.pos=Math.max(0,Math.min(Mini.m.bw.length-1,Mini.pos+(e.key==='ArrowDown'?1:-1))); Mini.render();
  }
});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  activePanel=t.dataset.p;
  $('#p-'+activePanel).classList.add('on');
  if(activePanel==='mini' && !Mini.m) Mini.start(false);
  if(activePanel==='stats') renderStats();
  window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});
  focusIn();
});

$('#themeBtn').onclick=()=>{
  const n = document.documentElement.dataset.theme==='paper' ? 'ink' : 'paper';
  document.documentElement.dataset.theme=n;
  document.querySelector('meta[name=theme-color]').content = n==='paper'?'#E8E2D4':'#101C24';
};

(async function boot(){
  const saved = await Store.load(); if(saved) S=Object.assign(S,saved);
  $('#corpusCount').textContent = CLUES.length+' original cryptic clues · '+ORDER.length+' devices · '+MINI_OK.length+' usable in minis';
  daily = new Solver($('#p-daily'),'daily');
  daily.pick(dailyIndex(today()));
  practice = new Solver($('#p-practice'),'practice');
  practice.pick(Math.floor(Math.random()*CLUES.length));
  renderGuide(); renderStats(); paintRail(); initWelcome(); focusIn();
})();
</script>
