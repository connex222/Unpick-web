name: UNPICK teaching QA
on:
  push:
    branches: [improvement/unpick-teaching]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline editorial and teaching tests
        run: node --test tests/teaching.test.mjs
